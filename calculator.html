<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易计算器</title>
<style>
*{margin: 15px;font-size: 20px;}
body{text-align: center;margin-top: 80px;background:#f4f5f7;}
input{width: 120px;padding: 6px;border: 1px solid #ccc;border-radius:4px;}
select{padding:6px;}
button{padding: 6px 16px;background:#1d4ed8;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#res{color:#1d4ed8;font-weight:bold;margin-left:10px;}
</style>
</head>
<body>
<h2>简易计算器</h2>
<input type="text" id="num1" placeholder="输入数字">
<select id="op">
<option>+</option>
<option>-</option>
<option>*</option>
<option>/</option>
</select>
<input type="text" id="num2" placeholder="输入数字">
<button onclick="calc()">=</button>
<span id="res"></span>

<script>
function calc(){
let a=Number(document.getElementById('num1').value);
let b=Number(document.getElementById('num2').value);
let op=document.getElementById('op').value;
let ans;
if(op==="+") ans=a+b;
else if(op==="-") ans=a-b;
else if(op==="*") ans=a*b;
else ans=a/b;
document.getElementById('res').innerText = `结果：${ans}`;
}
</script>
</body>
</html>
